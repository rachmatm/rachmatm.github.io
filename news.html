<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News — The Neuron</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lato:900"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        color-scheme: light dark;
      }

      /* Running news ticker — The Neuron + Hard Fork + DeepMind + Technode */
      .news-ticker {
        display: flex;
        align-items: stretch;
        height: 100%;
        background: #fff;
        border-top: 1px solid #e2ddd2;
        font-family: "Lato", sans-serif;
        overflow: hidden;
      }

      .news-viewport {
        position: relative;
        flex: 1 1 auto;
        overflow: hidden;
        display: flex;
        align-items: center;
      }

      .news-track {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        will-change: transform;
        animation: news-scroll linear infinite;
      }

      .news-viewport:hover .news-track {
        animation-play-state: paused;
      }

      @keyframes news-scroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      .news-item {
        display: inline-flex;
        align-items: center;
        color: #222;
        text-decoration: none;
        font-size: 13px;
        padding: 0 10px;
      }

      .news-item:hover {
        text-decoration: underline;
      }

      .news-item::before {
        content: "•";
        margin-right: 18px;
        color: #ffeb3b;
        font-weight: 900;
      }

      .news-source {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0 18px;
        font-size: 11px;
        color: #999;
        white-space: nowrap;
      }

      .news-source a {
        color: #999;
        text-decoration: none;
      }

      .news-source a:hover {
        color: #ee2737;
        text-decoration: underline;
      }

      @media (prefers-color-scheme: dark) {
        .news-ticker {
          background: #1b1b1b;
          border-top-color: #2a2a2a;
        }
        .news-item {
          color: #e8e8e8;
        }
        .news-source,
        .news-source a {
          color: #8c8c8c;
        }
      }
    </style>
  </head>
  <body>
    <div class="news-ticker" id="newsTicker" hidden>
      <div class="news-viewport">
        <div class="news-track" id="newsTrack"></div>
      </div>
    </div>

    <script>
      (function () {
        var FEEDS = [
          {
            name: "The Neuron",
            href: "https://www.theneuron.ai",
            url: "https://www.theneuron.ai/feed/",
            items: []
          },
          {
            name: "Hard Fork",
            href: "https://www.nytimes.com/column/hard-fork",
            url: "https://feeds.simplecast.com/6HKOhNgS",
            items: []
          },
          {
            name: "DeepMind",
            href: "https://deepmind.google/blog/",
            url: "https://deepmind.google/blog/rss.xml",
            items: []
          },
          {
            name: "Technode",
            href: "https://technode.com/tag/ai/",
            url: "http://technode.com/tag/ai/feed",
            items: []
          }
        ];
        // Feeds are fetched client-side via rss2json (no CORS header).
        function feedEndpoint(url) {
          return (
            "https://api.rss2json.com/v1/api.json?rss_url=" +
            encodeURIComponent(url)
          );
        }
        var NEWS_REFRESH_MS = 5 * 60 * 1000; // news: refetch every 5 minutes

        var ticker = document.getElementById("newsTicker");
        var track = document.getElementById("newsTrack");
        var pageLoadedAt = Date.now();
        var startDelayMs = 10000;
        var resumeTimer = null;
        // Appear immediately but keep sliding paused for first 10s.
        ticker.hidden = false;
        track.style.animationPlayState = "paused";

        function decode(str) {
          var el = document.createElement("textarea");
          el.innerHTML = str || "";
          return el.value;
        }

        // Build one pass: headlines from all feeds interleaved.
        function buildSequence(frag) {
          // Interleave items from all feeds so they run together.
          var maxLen = 0;
          FEEDS.forEach(function (feed) {
            if (feed.items.length > maxLen) maxLen = feed.items.length;
          });
          for (var i = 0; i < maxLen; i++) {
            FEEDS.forEach(function (feed) {
              var item = feed.items[i];
              if (!item) return;
              var a = document.createElement("a");
              a.className = "news-item";
              a.href = item.link;
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = decode(item.title);
              frag.appendChild(a);
            });
          }
        }

        function sourceLink(href, text) {
          var a = document.createElement("a");
          a.href = href;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = text;
          return a;
        }

        function totalItems() {
          var n = 0;
          FEEDS.forEach(function (feed) {
            n += feed.items.length;
          });
          return n;
        }

        function rebuild() {
          if (!totalItems()) return;
          var frag = document.createDocumentFragment();
          // Two identical halves => translateX(-50%) scrolls seamlessly from left.
          buildSequence(frag);
          buildSequence(frag);
          track.innerHTML = "";
          track.appendChild(frag);
          var units = totalItems();
          track.style.animationDuration = Math.max(units * 6, 30) + "s";
          ticker.hidden = false;
          var elapsed = Date.now() - pageLoadedAt;
          if (elapsed < startDelayMs) {
            track.style.animationPlayState = "paused";
            if (!resumeTimer) {
              resumeTimer = setTimeout(function () {
                track.style.animationPlayState = "running";
              }, startDelayMs - elapsed);
            }
          } else {
            track.style.animationPlayState = "running";
          }
        }

        function loadNews() {
          FEEDS.forEach(function (feed) {
            fetch(feedEndpoint(feed.url), { cache: "no-store" })
              .then(function (r) {
                return r.json();
              })
              .then(function (d) {
                if (d && d.status === "ok" && d.items) {
                  feed.items = d.items;
                  rebuild();
                }
              })
              .catch(function () {
                /* network/proxy hiccup - keep the last headlines */
              });
          });
        }

        loadNews();
        setInterval(loadNews, NEWS_REFRESH_MS);
      })();
    </script>
  </body>
</html>
